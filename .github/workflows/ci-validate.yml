name: CI Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required files
        run: |
          MISSING=0
          for file in backend/.env.example frontend/.env.example .nvmrc sdk/package.json scripts/generate-sdk.sh scripts/fuzz-contract.sh; do
            [ ! -f "$file" ] && echo "::error::Missing: $file" && MISSING=1 || echo "Found: $file"
          done
          [ "$MISSING" -eq 1 ] && exit 1
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "Valid JSON"
      - name: Gitleaks Secret Scan
        # Open-source gitleaks image (no license required), same config and
        # no-git whole-tree scan as the previous commercial action.
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source . --config .gitleaks.toml --no-git --verbose --redact 100

  error-docs:
    name: Error Code Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-error-codes-doc.js --check

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: echo "Coverage reports from frontend/coverage/ and backend/coverage/"
